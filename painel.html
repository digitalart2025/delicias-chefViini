  const row = {...obj}; const id = row.id ?? nextId(); row.id = id;
  await sb.from(t).upsert({id, dados: row});

/* ---------- cálculos ---------- */
const chave = p => (String(p.tel||'').replace(/\D/g,'') || String(p.cliente||'').toLowerCase().trim());
function resumoCliente(c){
  const peds=T.pedidos.filter(p=>p.status!=='Cancelado' && chave(p)===chave(c));
  const total=peds.reduce((a,p)=>a+Number(p.total||0),0);
  const ult=peds.map(p=>p.criado||'').sort().pop()||'';
  const tags=[]; if(total>=500) tags.push(['VIP','t-warn']); if(peds.length>=3) tags.push(['Fiel','t-ok']); if(peds.length===1) tags.push(['Novo','t-mut']);
  return {peds,total,ult,tags};
}
function zapLink(tel,msg){ const n=String(tel||'').replace(/\D/g,''); return 'https://wa.me/55'+n+'?text='+encodeURIComponent(msg); }
function calc(){
  const ativos = T.pedidos.filter(p=>p.status!=='Cancelado');
  const fat = ativos.reduce((a,p)=>a+Number(p.total||0),0);
  const sinalPago = ativos.filter(p=>p.sinalStatus==='Pago').reduce((a,p)=>a+Number(p.sinal||0),0);
  const desp = T.despesas.reduce((a,d)=>a+Number(d.valor||0),0);
  const ticket = ativos.length ? fat/ativos.length : 0;
  return {fat, sinalPago, saldo:fat-sinalPago, desp, lucro:fat-desp, ticket, n:ativos.length};
}

function vPed(){

async function baixarEstoque(p,sinal){
  for(const it of (p.itens||[])){
    const prod=T.produtos.find(x=>x.nome===it.nome); if(!prod) continue;
    for(const f of (prod.ficha||[])){
      const e=T.estoque.find(x=>x.id===Number(f.ingId)); if(!e) continue;
      const nova=Math.max(0, Number(e.qtd||0)+sinal*Number(f.qtd||0)*Number(it.qtd||0));
      await salvar('estoque',{...e,qtd:Math.round(nova*1000)/1000});
    }
  }
}

window.addCupom=async ()=>{
  const codigo=$('kc').value.trim().toUpperCase(); const perc=Number($('kp').value||0);
  if(codigo.length<3||perc<=0||perc>100){ $('kmsg').textContent='Informe um código (mín. 3 letras) e um desconto entre 1 e 100%.'; return; }
  if(T.cupons.some(c=>c.codigo===codigo)){ $('kmsg').textContent='Esse código já existe.'; return; }
  await salvar('cupons',{codigo,percentual:perc,validade:$('kv').value,limite:Number($('ku').value||0)}); render();
};
window.addConta=async ()=>{ const d=$('cd').value.trim(), v=Number($('cv').value||0);
  if(!d||v<=0){ $('cmsg2').textContent='Informe a descrição e o valor.'; return; }
  await salvar('contas',{tipo:$('ctipo').value,descricao:d,valor:v,vencimento:$('cvv').value,pago:false}); render(); };
window.toggleConta=async (id)=>{ const x=T.contas.find(y=>y.id===id); if(!x) return; await salvar('contas',{...x,pago:!x.pago}); render(); };
window.salvarMeta=async ()=>{ const atual=T.config[0]||{}; const dados={...atual,metaFaturamento:Number($('mt').value||0),taxaCartao:Number($('tc').value||0)}; await salvar('config',dados); render(); };
window.addCli = async ()=>{
  const nome=$('cn').value.trim(); if(nome.length<3){ $('cmsg').textContent='Informe o nome.'; return; }
  await salvar('clientes',{nome, tel:$('ct').value.trim(), bairro:$('cb').value.trim(), endereco:$('ce').value.trim()}); render();
};
function vEst(){
  const form=`<div class="card" style="margin-bottom:16px"><div class="form">
    <div><label>Ingrediente</label><input id="en"></div><div><label>Quantidade</label><input id="eq" type="number" min="0"></div>
    <div><label>Unidade</label><input id="eu" placeholder="kg, un, L"></div><div><label>Mínimo</label><input id="em" type="number" min="0"></div>
    <div><label>Custo unit. (R$)</label><input id="ec" type="number" min="0" step="0.01"></div><div><button class="btn" onclick="addEst()">Adicionar</button></div></div><div class="msg" id="emsg"></div></div>`;
  const rows=T.estoque.map(e=>{const baixo=Number(e.qtd)<=Number(e.minimo||0);return [`<b>${esc(e.nome)}</b>`,`${e.qtd} ${esc(e.unidade||'')}`,e.minimo||0,R(e.custo),baixo?'<span class="tag t-bad">Repor</span>':'<span class="tag t-ok">OK</span>',`<button class="danger" onclick="apagar('estoque',${e.id})">Excluir</button>`]});
  return head('Estoque','Estoque')+form+`<div class="card">${rows.length?tabela(['Ingrediente','Quantidade','Mínimo','Custo','Situação',''],rows):'<div class="empty">Nenhum ingrediente cadastrado.</div>'}</div>`;
}
window.addEst = async ()=>{
  const nome=$('en').value.trim(); if(!nome){ $('emsg').textContent='Informe o ingrediente.'; return; }
  await salvar('estoque',{nome, qtd:Number($('eq').value||0), unidade:$('eu').value.trim(), minimo:Number($('em').value||0), custo:Number($('ec').value||0)}); render();
};
function agrega(){
  const ativos=T.pedidos.filter(p=>p.status!=='Cancelado');
  const porPrato={}, porBairro={}, porData={}, porCli={};
  ativos.forEach(p=>{
    (p.itens||[]).forEach(i=>{ const k=i.nome; porPrato[k]=porPrato[k]||{q:0,r:0}; porPrato[k].q+=Number(i.qtd||0); porPrato[k].r+=Number(i.qtd||0)*Number(i.preco||0); });
    const b=p.bairro||'Não informado'; porBairro[b]=porBairro[b]||{n:0,r:0}; porBairro[b].n++; porBairro[b].r+=Number(p.total||0);
    const d=p.dataEntrega||'a combinar'; porData[d]=porData[d]||{n:0,r:0}; porData[d].n++; porData[d].r+=Number(p.total||0);
    const c=p.cliente||'-'; porCli[c]=porCli[c]||{n:0,r:0}; porCli[c].n++; porCli[c].r+=Number(p.total||0);
  });
  return {ativos,porPrato,porBairro,porData,porCli};
}
function vRel(){
  const g=agrega(); const c=calc();
  const pagos=g.ativos.filter(p=>p.sinalStatus==='Pago').length;
  const ord=(o,k)=>Object.entries(o).sort((a,b)=>b[1][k]-a[1][k]);
  const tb=(cols,rows)=>rows.length?tabela(cols,rows):'<div class="empty">Sem dados ainda.</div>';
  return head('Relatórios','Relatórios de vendas',`<button class="ghost" onclick="exportCSV()">Exportar CSV</button><button class="btn" onclick="window.print()">Imprimir</button>`)+
  `<div class="grid k4" style="margin-bottom:16px">
    ${kpi('Pedidos ativos',c.n,pagos+' com sinal pago')}${kpi('Faturamento',R(c.fat),'total dos pedidos')}
    ${kpi('Ticket médio',R(c.ticket),'por pedido')}${kpi('Saldo a receber',R(c.saldo),'após sinal')}</div>
  <div class="grid k2" style="margin-bottom:16px">
    <div class="card"><h3 class="sect">Vendas por prato</h3>${tb(['Prato','Qtd','Receita'],ord(g.porPrato,'r').map(([n,v])=>[esc(n),v.q,R(v.r)]))}</div>
    <div class="card"><h3 class="sect">Vendas por bairro</h3>${tb(['Bairro','Pedidos','Receita'],ord(g.porBairro,'r').map(([n,v])=>[esc(n),v.n,R(v.r)]))}</div>
    <div class="card"><h3 class="sect">Entregas por data</h3>${tb(['Data','Pedidos','Receita'],ord(g.porData,'r').map(([n,v])=>[esc(n),v.n,R(v.r)]))}</div>
    <div class="card"><h3 class="sect">Melhores clientes</h3>${tb(['Cliente','Pedidos','Total'],ord(g.porCli,'r').slice(0,10).map(([n,v])=>[esc(n),v.n,R(v.r)]))}</div>
  </div>`;
}
window.exportCSV=()=>{
  const g=agrega(); const linhas=[['Cliente','Telefone','Bairro','Entrega','Itens','Total','Sinal','Sinal status','Status']];
  g.ativos.forEach(p=>linhas.push([p.cliente,p.tel||'',p.bairro||'',p.dataEntrega||'',(p.itens||[]).map(i=>i.qtd+'x '+i.nome).join(' | '),p.total||0,p.sinal||0,p.sinalStatus||'',p.status||'']));
  const csv=linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})); a.download='pedidos.csv'; a.click();
};
function vProdutos(){
  if(fichaP) return vFichaProd();
  const semProd = T.produtos.length < CATALOGO.length;
  const seed = semProd ? `<div class="card gold" style="margin-bottom:16px"><div class="row" style="justify-content:space-between"><div>Importe o cardápio completo: pratos, tortas e sobremesas, com os preços atuais.</div><button class="btn" onclick="importarCardapio()">Importar cardápio completo</button></div></div>` : '';
  const form=`<div class="card" style="margin-bottom:16px"><div class="form">
    <div><label>Produto</label><input id="qn"></div><div><label>Categoria</label><select id="qc"><option>Pratos Principais</option><option>Tortas e Empadões</option><option>Sobremesas</option></select></div>
    <div><label>Preço (R$)</label><input id="qp" type="number" min="0" step="0.01"></div>
    <div><button class="btn" onclick="addProd()">Cadastrar produto</button></div></div><div class="msg" id="qmsg"></div></div>`;
  const rows=T.produtos.map(p=>{ const c=custoProd(p); const m=p.preco?Math.round((p.preco-c)/p.preco*100):0;
    const tam=p.tam;
    const precoTxt = tam ? ['P','M','G','GG'].map(k=>`${k} ${R(tam[k])}`).join(' · ') : R(p.preco);
    const precoCell = precoEditId===p.id
      ? (tam
          ? `<div class="row" style="gap:6px">${['P','M','G','GG'].map(k=>`<span style="font-size:11px;color:var(--mut)">${k}</span><input id="pe${p.id}${k}" type="number" min="0" step="0.01" value="${tam[k]}" style="width:86px;padding:6px">`).join('')}<button class="btn" style="padding:6px 10px" onclick="salvarPreco(${p.id})">Salvar</button><button class="ghost" style="padding:6px 10px" onclick="cancelPreco()">×</button></div>`
          : `<div class="row"><input id="pe${p.id}" type="number" min="0" step="0.01" value="${p.preco}" style="width:110px"><button class="btn" style="padding:6px 10px" onclick="salvarPreco(${p.id})">Salvar</button><button class="ghost" style="padding:6px 10px" onclick="cancelPreco()">×</button></div>`)
      : `<div class="row"><span style="font-size:13px">${precoTxt}</span><button class="ghost" style="padding:4px 8px;font-size:11px" onclick="editarPreco(${p.id})">Editar</button></div>`;
    return [`<b>${esc(p.nome)}</b>`, esc(p.categoria||''), precoCell, R(c), `<span class="tag ${m>=50?'t-ok':m>=30?'t-warn':'t-bad'}">${m}%</span>`,
      `<button class="ghost" style="padding:6px 10px" onclick="toggleProd(${p.id})">${p.status==='Pausado'?'Pausado':'Ativo'}</button>`,
      `<div class="row"><button class="ghost" style="padding:6px 10px" onclick="abrirFichaProd(${p.id})">Ficha técnica</button><button class="danger" onclick="apagar('produtos',${p.id})">Excluir</button></div>`]; });
  return head('Produtos','Produtos e custos')+seed+form+`<div class="card">${rows.length?tabela(['Produto','Categoria','Preço','Custo','Margem','Status',''],rows):'<div class="empty">Nenhum produto cadastrado.</div>'}</div>`;
}
window.editarPreco=(id)=>{ precoEditId=id; render(); };
window.cancelPreco=()=>{ precoEditId=null; render(); };
window.salvarPreco=async (id)=>{
  const p=T.produtos.find(x=>x.id===id); if(!p) return;
  if(p.tam){
    const tam={};
    for(const k of ['P','M','G','GG']){ const v=Number(document.getElementById('pe'+id+k)?.value||0); if(!(v>0)){ alert('Informe preços maiores que zero em todos os tamanhos.'); return; } tam[k]=v; }
    await salvar('produtos',{...p,tam,preco:tam.M}); precoEditId=null; render(); return;
  }
  const v=Number(document.getElementById('pe'+id)?.value||0);
  if(!(v>0)){ alert('Informe um preço maior que zero.'); return; }
  await salvar('produtos',{...p,preco:v}); precoEditId=null; render();
};
window.importarCardapio=async ()=>{
  for(const [nome,categoria,preco] of CATALOGO){
    const existe=T.produtos.find(x=>x.nome===nome);
    if(existe){ if(existe.preco===undefined && preco.preco!==undefined){} continue; }
    await salvar('produtos',{nome,categoria,...preco,status:'Ativo',ficha:[]});
  }
  render();
};
window.addProd=async ()=>{ const nome=$('qn').value.trim(); const preco=Number($('qp').value||0);
  if(nome.length<3||preco<=0){ $('qmsg').textContent='Informe o nome e um preço maior que zero.'; return; }
  await salvar('produtos',{nome,categoria:$('qc').value,preco,status:'Ativo',ficha:[]}); render(); };
window.toggleProd=async (id)=>{ const p=T.produtos.find(x=>x.id===id); if(!p) return; await salvar('produtos',{...p,status:p.status==='Pausado'?'Ativo':'Pausado'}); render(); };
window.abrirFichaProd=(id)=>{ const p=T.produtos.find(x=>x.id===id); fichaP={id,ficha:(p.ficha||[]).map(f=>({...f}))}; render(); };
window.fecharFichaProd=()=>{ fichaP=null; render(); };
function guardaFicha(){ fichaP.ficha=fichaP.ficha.map((_,i)=>({ingId:Number(document.getElementById('fi'+i).value),qtd:Number(document.getElementById('fq'+i).value||0)})); }
window.addFichaRow=()=>{ guardaFicha(); fichaP.ficha.push({ingId:(T.estoque[0]?.id||0),qtd:1}); render(); };
window.rmFichaRow=(i)=>{ guardaFicha(); fichaP.ficha.splice(i,1); render(); };
window.salvarFicha=async ()=>{ guardaFicha(); const p=T.produtos.find(x=>x.id===fichaP.id); await salvar('produtos',{...p,ficha:fichaP.ficha}); fichaP=null; render(); };
function vFichaProd(){
  const p=T.produtos.find(x=>x.id===fichaP.id);
  const ing=T.estoque.map(e=>`<option value="${e.id}">${esc(e.nome)} (${esc(e.unidade||'')})</option>`).join('');
  const linhas=fichaP.ficha.map((f,i)=>`<div class="form" style="grid-template-columns:2fr 1fr auto"><div><select id="fi${i}">${T.estoque.map(e=>`<option value="${e.id}" ${e.id===Number(f.ingId)?'selected':''}>${esc(e.nome)} (${esc(e.unidade||'')})</option>`).join('')}</select></div><div><input id="fq${i}" type="number" min="0" step="0.001" value="${f.qtd}"></div><div><button class="danger" onclick="rmFichaRow(${i})">Remover</button></div></div>`).join('');
  return head('Ficha técnica', esc(p.nome), `<button class="ghost" onclick="fecharFichaProd()">← Voltar</button>`)+
  `<div class="card gold"><p style="color:var(--mut);margin-top:0">Quantidade de cada ingrediente usada em <b>1 unidade</b> deste prato, na mesma unidade do estoque.</p>${linhas||'<div class="empty" style="padding:14px">Nenhum ingrediente na ficha.</div>'}
  <div class="row" style="margin-top:12px;justify-content:space-between"><button class="ghost" onclick="addFichaRow()" ${T.estoque.length?'':'disabled'}>+ Ingrediente</button>
  <div><span style="color:var(--mut)">Custo estimado:</span> <b style="color:var(--gold2)">${R(custoProd({ficha:fichaP.ficha}))}</b> &nbsp; <button class="btn" onclick="salvarFicha()">Salvar ficha</button></div></div></div>`;
}
function vFin(){
  const c=calc();
  const form=`<div class="card" style="margin-bottom:16px"><div class="form">
    <div><label>Data</label><input id="dd" type="date"></div><div><label>Descrição</label><input id="dn"></div>
    <div><label>Valor (R$)</label><input id="dv" type="number" min="0" step="0.01"></div>
    <div><label>Categoria</label><select id="dc"><option>Insumos</option><option>Embalagens</option><option>Taxas</option><option>Outros</option></select></div>
    <div><button class="btn" onclick="addDesp()">Lançar despesa</button></div></div><div class="msg" id="dmsg"></div></div>`;
  const rows=T.despesas.slice().sort((a,b)=>String(b.data).localeCompare(String(a.data))).map(d=>[esc(d.data||''),esc(d.descricao),esc(d.categoria),R(d.valor),`<button class="danger" onclick="apagar('despesas',${d.id})">Excluir</button>`]);
  const pct = c.fat ? Math.max(0,Math.min(100,Math.round(c.lucro/c.fat*100))) : 0;
  const hoje=new Date().toISOString().slice(0,10);
  const pagar=T.contas.filter(x=>x.tipo==='pagar'&&!x.pago), receber=T.contas.filter(x=>x.tipo==='receber'&&!x.pago);
  const soma=l=>l.reduce((a,x)=>a+Number(x.valor||0),0);
  const cfg=CFG(); const meta=Number(cfg.metaFaturamento||0); const prog=meta?Math.min(100,Math.round(c.fat/meta*100)):0;
  const formas=FORMAS.map(f=>{const v=T.pedidos.filter(p=>p.status!=='Cancelado'&&(p.forma||'Pix')===f).reduce((a,p)=>a+Number(p.total||0),0);return [f,R(v)];});
  const taxa=T.pedidos.filter(p=>p.status!=='Cancelado'&&p.forma==='Cartão').reduce((a,p)=>a+Number(p.total||0),0)*Number(cfg.taxaCartao||0)/100;
  const contasRows=T.contas.slice().sort((a,b)=>String(a.vencimento).localeCompare(String(b.vencimento))).map(x=>{
    const st=x.pago?'<span class="tag t-ok">Pago</span>':(x.vencimento&&x.vencimento<hoje)?'<span class="tag t-bad">Vencido</span>':(x.vencimento===hoje?'<span class="tag t-warn">Vence hoje</span>':'<span class="tag t-mut">Em dia</span>');
    return [esc(x.tipo==='pagar'?'A pagar':'A receber'),esc(x.descricao),esc(x.vencimento||'-'),R(x.valor),st,`<div class="row"><button class="ghost" style="padding:6px 10px" onclick="toggleConta(${x.id})">${x.pago?'Reabrir':'Baixar'}</button><button class="danger" onclick="apagar('contas',${x.id})">Excluir</button></div>`];});
  const contasHtml=`<div class="grid k2" style="margin-top:16px">
    <div class="card"><h3 class="sect">Contas a pagar em aberto</h3><div style="font-size:22px;color:var(--gold2)">${R(soma(pagar))}</div></div>
    <div class="card"><h3 class="sect">Contas a receber em aberto</h3><div style="font-size:22px;color:var(--gold2)">${R(soma(receber))}</div></div></div>
    <div class="card" style="margin-top:16px"><div class="form"><div><label>Tipo</label><select id="ctipo"><option value="pagar">A pagar</option><option value="receber">A receber</option></select></div>
    <div><label>Descrição</label><input id="cd"></div><div><label>Valor (R$)</label><input id="cv" type="number" min="0" step="0.01"></div><div><label>Vencimento</label><input id="cvv" type="date"></div>
    <div><button class="btn" onclick="addConta()">Lançar</button></div></div><div class="msg" id="cmsg2"></div>
    ${contasRows.length?tabela(['Tipo','Descrição','Vencimento','Valor','Situação',''],contasRows):'<div class="empty">Nenhuma conta lançada.</div>'}</div>`;
  const barras=(titulo,itens)=>{ const max=Math.max(1,...itens.map(i=>i[1])); return `<div class="card"><h3 class="sect">${titulo}</h3>${itens.length?itens.map(([n,v])=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${esc(n)}</span><span>${R(v)}</span></div><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div></div>`).join(''):'<div class="empty">Sem dados.</div>'}</div>`; };
  const porDia={}; T.pedidos.filter(p=>p.status!=='Cancelado').forEach(p=>{const d=p.dataEntrega||'a combinar'; porDia[d]=(porDia[d]||0)+Number(p.total||0);});
  const graficos=`<div class="grid k2" style="margin-top:16px">${barras('Vendas por data de entrega',Object.entries(porDia).sort())}${barras('Recebimento por forma de pagamento',FORMAS.map(f=>[f,T.pedidos.filter(p=>p.status!=='Cancelado'&&(p.forma||'Pix')===f).reduce((a,p)=>a+Number(p.total||0),0)]))}</div>`;
  const metaHtml=`<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h3 class="sect" style="margin:0">Meta de faturamento</h3><div class="row"><input id="mt" type="number" min="0" value="${meta||''}" placeholder="R$ meta" style="width:160px"><input id="tc" type="number" min="0" step="0.1" value="${cfg.taxaCartao}" style="width:120px" title="Taxa do cartão (%)"><button class="ghost" onclick="salvarMeta()">Salvar</button></div></div>
    <div style="margin-top:12px">${meta?`<div class="row" style="justify-content:space-between"><span>${R(c.fat)} de ${R(meta)}</span><span>${prog}%</span></div><div class="bar"><i style="width:${prog}%"></i></div>`:'<div class="empty" style="padding:14px">Defina uma meta para acompanhar o progresso.</div>'}</div>
    <div class="row" style="margin-top:12px;justify-content:space-between;color:var(--mut)"><span>Taxa estimada do cartão</span><b style="color:var(--gold2)">${R(taxa)}</b></div></div>`;
  return head('Financeiro','Financeiro')+metaHtml+graficos+contasHtml+
  `<div class="grid k4" style="margin-bottom:16px">${kpi('Faturamento',R(c.fat),'pedidos ativos')}${kpi('Despesas',R(c.desp),'lançadas')}${kpi('Lucro',R(c.lucro),pct+'% da receita')}${kpi('Ticket médio',R(c.ticket),'por pedido')}</div>
  <div class="card" style="margin-bottom:16px"><div class="muted" style="color:var(--mut);font-size:12px">Margem de lucro</div><div class="bar"><i style="width:${pct}%"></i></div></div>`+
  form+`<div class="card">${rows.length?tabela(['Data','Descrição','Categoria','Valor',''],rows):'<div class="empty">Nenhuma despesa lançada.</div>'}</div>`;
}
window.addDesp = async ()=>{
  const d=$('dn').value.trim(); const v=Number($('dv').value||0);
  if(!d||v<=0){ $('dmsg').textContent='Informe a descrição e o valor.'; return; }
  await salvar('despesas',{data:$('dd').value, descricao:d, valor:v, categoria:$('dc').value}); render();
};
</script></body></html>
